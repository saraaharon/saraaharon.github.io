    <style>

        /* ===== #30DayMapChallenge: Instagram-style grid ===== */

        .mc-section{
            padding:20px 0 90px;
        }

        .mc-grid{
            display:grid;
            grid-template-columns:repeat(3, 1fr);   /* always 3 per row */
            gap:6px;
        }

        .mc-tile{
            position:relative;
            display:block;
            aspect-ratio:1 / 1;                     /* square, like Instagram */
            padding:0;
            border:0;
            border-radius:6px;
            overflow:hidden;
            background:#0b0f1a;                     /* same dark as the maps */
            cursor:pointer;
            font:inherit;
        }

        .mc-tile img,
.mc-tile video{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    transition:transform .35s ease;
}

.mc-tile:hover img,
.mc-tile:hover video,
.mc-tile:focus-visible img,
.mc-tile:focus-visible video{
    transform:scale(1.04);
}

        /* "Day 1" pill, always visible */
        .mc-badge{
            position:absolute;
            top:10px;
            left:10px;
            padding:4px 10px;
            border-radius:999px;
            background:rgba(11,15,26,.78);
            color:#fff;
            font-size:12px;
            font-weight:700;
            letter-spacing:.3px;
        }

        /* play icon on video tiles */
        .mc-play{
            position:absolute;
            top:10px;
            right:10px;
            width:28px;
            height:28px;
            border-radius:50%;
            background:rgba(11,15,26,.78);
            color:#fff;
            font-size:11px;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        /* title on hover */
        .mc-overlay{
            position:absolute;
            inset:0;
            display:flex;
            flex-direction:column;
            justify-content:flex-end;
            padding:16px;
            text-align:left;
            color:#fff;
            background:linear-gradient(to top, rgba(11,15,26,.92), rgba(11,15,26,0) 60%);
            opacity:0;
            transition:opacity .25s ease;
            pointer-events:none;
        }

        .mc-badge,
        .mc-play,
        .mc-overlay{
            z-index:2;
        }

        .mc-tile video{
            position:relative;
            z-index:1;
        }

        .mc-tile:hover .mc-overlay,
        .mc-tile:focus-visible .mc-overlay{
            opacity:1;
        }

        .mc-overlay strong{
            font-size:15px;
            font-weight:700;
            line-height:1.3;
        }

        .mc-overlay span{
            margin-top:4px;
            font-size:12px;
            color:#c7cde0;
        }

        /* ===== Lightbox ===== */

        .mc-lightbox{
            position:fixed;
            inset:0;
            z-index:1000;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:24px;
            background:rgba(5,8,15,.94);
        }

        .mc-lightbox[hidden]{
            display:none;
        }

        .mc-stage{
            display:flex;
            align-items:center;
            justify-content:center;
            max-width:min(1100px, 100%);
            max-height:82vh;
        }

        .mc-stage img,
        .mc-stage video{
            max-width:100%;
            max-height:82vh;
            border-radius:10px;
            background:#0b0f1a;
        }

        .mc-caption{
            margin-top:16px;
            max-width:760px;
            text-align:center;
            color:#c7cde0;
            font-size:14px;
            line-height:1.6;
        }

        .mc-caption b{
            color:#fff;
        }

        .mc-btn{
            position:absolute;
            border:0;
            background:rgba(255,255,255,.08);
            color:#fff;
            width:44px;
            height:44px;
            border-radius:50%;
            font-size:20px;
            cursor:pointer;
        }

        .mc-btn:hover{
            background:rgba(255,255,255,.18);
        }

        .mc-close{ top:20px; right:20px; }
        .mc-prev{ left:20px; top:50%; transform:translateY(-50%); }
        .mc-next{ right:20px; top:50%; transform:translateY(-50%); }

        /* ===== Mobile: still 3 per row, like Instagram ===== */

        @media (max-width:700px){

            .mc-grid{ gap:3px; }
            .mc-tile{ border-radius:3px; }
            .mc-overlay{ display:none; }
            .mc-badge{ top:5px; left:5px; padding:2px 7px; font-size:10px; }
            .mc-play{ top:5px; right:5px; width:20px; height:20px; font-size:8px; }
            .mc-prev, .mc-next{ display:none; }

        }

        /* ===== Mobile nav fix: links on top, logo underneath ===== */

html, body{
    overflow-x:hidden;          /* safety net: page never scrolls sideways */
}

@media (max-width:700px){

    nav{
        flex-direction:column-reverse;   /* links first, logo under them */
        align-items:flex-start;
        gap:10px;
        padding:16px 20px;

        flex-wrap:wrap;
        gap:6px 18px;
        margin:0;
        padding:0;
    }

    nav ul li a{
        font-size:15px;
    }

}

<script>

    (function () {

        var tiles = Array.prototype.slice.call(document.querySelectorAll('.mc-tile'));
        var box = document.getElementById('mcLightbox');
        var stage = document.getElementById('mcStage');
        var caption = document.getElementById('mcCaption');
        var current = 0;
        document.querySelectorAll('.mc-tile video').forEach(function (v) {
    v.muted = true;
    v.play().catch(function () {});
});

        function show(i) {

            current = (i + tiles.length) % tiles.length;
            var t = tiles[current];

            stage.innerHTML = '';

            if (t.dataset.video) {
                var v = document.createElement('video');
                v.src = t.dataset.video;
                v.controls = true;
                v.autoplay = true;
                v.muted = true;
                v.loop = true;
                v.playsInline = true;
                stage.appendChild(v);
            } else {
                var img = document.createElement('img');
                img.src = t.dataset.full || t.querySelector('img').getAttribute('src');
                img.alt = t.querySelector('img').alt;
                stage.appendChild(img);
            }

            caption.innerHTML = t.dataset.caption || '';
            box.hidden = false;
            document.body.style.overflow = 'hidden';

        }

        function close() {
            stage.innerHTML = '';          // also stops any playing video
            box.hidden = true;
            document.body.style.overflow = '';
        }

        tiles.forEach(function (t, i) {
            t.addEventListener('click', function () { show(i); });
        });

        document.getElementById('mcClose').addEventListener('click', close);
        document.getElementById('mcPrev').addEventListener('click', function () { show(current - 1); });
        document.getElementById('mcNext').addEventListener('click', function () { show(current + 1); });

        box.addEventListener('click', function (e) {
            if (e.target === box) close();     // click on the dark background
        });

        document.addEventListener('keydown', function (e) {
            if (box.hidden) return;
            if (e.key === 'Escape') close();
            if (e.key === 'ArrowLeft') show(current - 1);
            if (e.key === 'ArrowRight') show(current + 1);
        });

    })();

</script>
