    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { overflow-x: hidden; }

        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        #stars {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        nav, main, footer { position: relative; z-index: 1; }

        .container { width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 24px; }

        /* Nav */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px 28px;
            padding: 28px 40px;
        }
        nav .logo { font-weight: 600; letter-spacing: 0.04em; }
        nav ul { display: flex; gap: 28px; list-style: none; }
        nav a {
            color: rgba(255, 255, 255, 0.65);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        nav a:hover { color: #fff; }

        main { flex: 1; padding: 20px 0 90px; }

        /* Grid */
        .mc-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .mc-tile {
            position: relative;
            display: block;
            aspect-ratio: 1 / 1;
            padding: 0;
            border: 0;
            border-radius: 6px;
            overflow: hidden;
            background: #0b0f1a;
            cursor: pointer;
            font: inherit;
            width: 100%;
        }

        .mc-tile img,
        .mc-tile video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: transform 0.35s ease;
            pointer-events: none; /* Prevents video elements from intercepting clicks meant for the tile button */
        }

        .mc-tile:hover img,
        .mc-tile:hover video,
        .mc-tile:focus-visible img,
        .mc-tile:focus-visible video { transform: scale(1.04); }

        /* Lightbox */
        .mc-lightbox {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(5, 8, 15, 0.94);
        }
        .mc-lightbox[hidden] { display: none; }

        .mc-stage {
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: min(1100px, 100%);
            max-height: 82vh;
        }
        .mc-stage img,
        .mc-stage video {
            max-width: 100%;
            max-height: 82vh;
            border-radius: 10px;
            background: #0b0f1a;
        }

        .mc-caption {
            margin-top: 16px;
            max-width: 760px;
            text-align: center;
            color: #c7cde0;
            font-size: 14px;
            line-height: 1.6;
        }
        .mc-caption b { color: #fff; }

        .mc-btn {
            position: absolute;
            border: 0;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }
        .mc-btn:hover { background: rgba(255, 255, 255, 0.18); }
        .mc-close { top: 20px; right: 20px; }
        .mc-prev { left: 20px; top: 50%; transform: translateY(-50%); }
        .mc-next { right: 20px; top: 50%; transform: translateY(-50%); }

        /* Footer */
        footer {
            padding: 32px 24px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 28px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .footer-links a {
            color: rgba(255, 255, 255, 0.65);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .footer-links a:hover { color: #fff; }
        .copyright { font-size: 0.8rem; color: rgba(255, 255, 255, 0.4); }

        /* Mobile */
        @media (max-width: 700px) {
            nav { padding: 20px; }
            nav ul { gap: 18px; }
            .container { padding: 0 12px; }
            .mc-grid { gap: 3px; }
            .mc-tile { border-radius: 3px; }
            .mc-prev, .mc-next { display: none; }
        }
    </style>
</head>

<script>
    (function () {
        var tiles = Array.prototype.slice.call(document.querySelectorAll('.mc-tile'));
        var box = document.getElementById('mcLightbox');
        var stage = document.getElementById('mcStage');
        var caption = document.getElementById('mcCaption');
        var current = 0;

        document.querySelectorAll('.mc-tile video').forEach(function (v) {
            v.muted = true;
            v.play().catch(function () {});
        });

        function show(i) {
            current = (i + tiles.length) % tiles.length;
            var t = tiles[current];
            stage.innerHTML = '';

            if (t.dataset.video) {
                var v = document.createElement('video');
                v.src = t.dataset.video;
                v.controls = true;
                v.autoplay = true;
                v.muted = true;
                v.loop = true;
                v.playsInline = true;
                stage.appendChild(v);
            } else {
                var img = document.createElement('img');
                var imgSource = t.dataset.full || (t.querySelector('img') ? t.querySelector('img').getAttribute('src') : '');
                var imgAlt = t.querySelector('img') ? t.querySelector('img').alt : '';
                img.src = imgSource;
                img.alt = imgAlt;
                stage.appendChild(img);
            }

            caption.innerHTML = t.dataset.caption || '';
            box.hidden = false;
            document.body.style.overflow = 'hidden';
        }

        function close() {
            stage.innerHTML = '';
            box.hidden = true;
            document.body.style.overflow = '';
        }

        tiles.forEach(function (t, i) {
            t.addEventListener('click', function () { show(i); });
        });

        document.getElementById('mcClose').addEventListener('click', close);
        document.getElementById('mcPrev').addEventListener('click', function (e) { e.stopPropagation(); show(current - 1); });
        document.getElementById('mcNext').addEventListener('click', function (e) { e.stopPropagation(); show(current + 1); });

        box.addEventListener('click', function (e) {
            if (e.target === box) close();
        });

        document.addEventListener('keydown', function (e) {
            if (box.hidden) return;
            if (e.key === 'Escape') close();
            if (e.key === 'ArrowLeft') show(current - 1);
            if (e.key === 'ArrowRight') show(current + 1);
        });
    })();

    // Stars Canvas
    (function () {
        var canvas = document.getElementById('stars');
        var ctx = canvas.getContext('2d');
        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var stars = [];
        var w, h;

        function init() {
            var dpr = window.devicePixelRatio || 1;
            w = window.innerWidth;
            h = window.innerHeight;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            var count = Math.round((w * h) / 9000);
            stars = Array.from({ length: count }, function () {
                return {
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: Math.random() * 1.1 + 0.3,
                    speed: Math.random() * 1.5 + 0.5,
                    phase: Math.random() * Math.PI * 2
                };
            });
        }

        function draw(t) {
            ctx.clearRect(0, 0, w, h);
            for (var i = 0; i < stars.length; i++) {
                var s = stars[i];
                ctx.globalAlpha = reduceMotion ? 0.7 : 0.2 + 0.8 * (0.5 + 0.5 * Math.sin(t * 0.001 * s.speed + s.phase));
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            }
            if (!reduceMotion) requestAnimationFrame(draw);
        }

        window.addEventListener('resize', function () { init(); if (reduceMotion) draw(0); });
        init();
        requestAnimationFrame(draw);
    })();
</script>
