<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✧</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Stars */
        #stars {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        nav, .hero, footer { position: relative; z-index: 1; }

        /* Nav */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 28px 40px;
        }
        nav .logo { font-weight: 600; letter-spacing: 0.04em; }
        nav ul { display: flex; gap: 28px; list-style: none; }
        nav a {
            color: rgba(255, 255, 255, 0.65);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        nav a:hover { color: #fff; }

        /* Hero */
        .hero {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 24px;
        }
        .eyebrow {
            font-size: 0.8rem;
            letter-spacing: 0.35em;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 24px;
        }
        h1 {
            font-size: clamp(2.5rem, 7vw, 5rem);
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.02em;
            margin-bottom: 40px;
        }
        .buttons { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
        .buttons a {
            padding: 12px 28px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.2s, background 0.2s;
        }
        .buttons a:hover { transform: translateY(-2px); }
        .primary { background: #fff; color: #000; }
        .secondary { border: 1px solid rgba(255, 255, 255, 0.4); color: #fff; }
        .secondary:hover { background: rgba(255, 255, 255, 0.1); }

        /* Footer */
        footer {
            padding: 32px 24px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 28px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .footer-links a {
            color: rgba(255, 255, 255, 0.65);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .footer-links a:hover { color: #fff; }
        .copyright { font-size: 0.8rem; color: rgba(255, 255, 255, 0.4); }

        @media (max-width: 600px) {
            nav { padding: 20px; }
            nav ul { gap: 18px; }
        }
    </style>
</head>

<body class="home">

<canvas id="stars" aria-hidden="true"></canvas>

<nav>
    <div class="logo">Sara Aharon</div>
</nav>

<section class="hero">
    <div class="hero-content">
        <p class="eyebrow">✧ EARTH OBSERVATION ✧</p>
        <h1>Maps, data and stories.</h1>
        <div class="buttons">
            <a href="/projects.html" class="primary">Portfolio</a>
            <a href="assets/files/Sara Aharon CV.pdf" class="secondary" target="_blank">CV</a>
        </div>
    </div>
</section>

<footer>
    <div class="container">
        <div class="footer-links">
            <a href="https://github.com/saraaharon" target="_blank">GitHub</a>
            <a href="https://www.linkedin.com/in/saraaharon/" target="_blank">LinkedIn</a>
            <a href="https://orcid.org/0009-0001-8809-5491" target="_blank">ORCID</a>
            <a href="mailto:sara.aharon@yahoo.com">Email</a>
        </div>
        <p class="copyright">© 2026 Sara Aharon</p>
    </div>
</footer>

<script>
    (function () {
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let stars = [];
        let w, h;

        function init() {
            const dpr = window.devicePixelRatio || 1;
            w = window.innerWidth;
            h = window.innerHeight;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const count = Math.round((w * h) / 9000); // density scales with screen size
            stars = Array.from({ length: count }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 1.1 + 0.3,
                speed: Math.random() * 1.5 + 0.5,
                phase: Math.random() * Math.PI * 2
            }));
        }

        function draw(t) {
            ctx.clearRect(0, 0, w, h);
            for (const s of stars) {
                const a = reduceMotion ? 0.7 : 0.2 + 0.8 * (0.5 + 0.5 * Math.sin(t * 0.001 * s.speed + s.phase));
                ctx.globalAlpha = a;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            }
            if (!reduceMotion) requestAnimationFrame(draw);
        }

        window.addEventListener('resize', () => { init(); if (reduceMotion) draw(0); });
        init();
        requestAnimationFrame(draw);
    })();
</script>

</body>
</html>
